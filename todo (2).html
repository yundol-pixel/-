<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>오늘 할 일</title>

  <!-- 홈 화면 앱 이름 & 아이콘 설정 -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="오늘 할 일" />
  <meta name="application-name" content="오늘 할 일" />
  <link rel="apple-touch-icon" href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAxMjggMTI4Ij48cmVjdCB3aWR0aD0iMTI4IiBoZWlnaHQ9IjEyOCIgcng9IjI4IiBmaWxsPSIjMUExQTFBIi8+PHBvbHlsaW5lIHBvaW50cz0iMjgsMTUgNDgsMTMgNjgsNDUiIGZpbGw9Im5vbmUiIHN0cm9rZT0id2hpdGUiIHN0cm9rZS13aWR0aD0iMTAiIHN0cm9rZS1saW5lY2FwPSJyb3VuZCIgc3Ryb2tlLWxpbmVqb2luPSJyb3VuZCIgdHJhbnNmb3JtPSJ0cmFuc2xhdGUoMTIsMzApIHNjYWxlKDEuNSkiLz48L3N2Zz4=" />

  <!-- 아이콘 SVG (인라인 생성) -->
  <script>
    (function() {
      const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
        <rect width="128" height="128" rx="28" fill="#1A1A1A"/>
        <polyline points="28,66 50,88 100,40"
          fill="none" stroke="white" stroke-width="11"
          stroke-linecap="round" stroke-linejoin="round"/>
      </svg>`;
      const blob = new Blob([svg], {type: 'image/svg+xml'});
      const url = URL.createObjectURL(blob);
      const link = document.createElement('link');
      link.rel = 'apple-touch-icon';
      link.href = url;
      document.head.appendChild(link);
      const link2 = document.createElement('link');
      link2.rel = 'icon';
      link2.href = url;
      document.head.appendChild(link2);
    })();
  </script>

  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Noto Sans KR', sans-serif;
      background: #F7F7F5;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 48px 16px 80px;
    }

    .container {
      width: 100%;
      max-width: 420px;
    }

    /* Header */
    .header {
      margin-bottom: 36px;
    }

    .date-label {
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.12em;
      color: #AAAAAA;
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    .title {
      font-size: 28px;
      font-weight: 600;
      color: #1A1A1A;
      line-height: 1.2;
    }

    .progress-bar-wrap {
      margin-top: 16px;
      background: #E8E8E4;
      border-radius: 99px;
      height: 4px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      background: #1A1A1A;
      border-radius: 99px;
      width: 0%;
      transition: width 0.4s ease;
    }

    .progress-text {
      margin-top: 8px;
      font-size: 12px;
      color: #AAAAAA;
      font-weight: 400;
    }

    /* Input area */
    .input-area {
      display: flex;
      gap: 10px;
      margin-bottom: 28px;
    }

    .task-input {
      flex: 1;
      border: 1.5px solid #E0E0DC;
      border-radius: 12px;
      padding: 14px 16px;
      font-family: 'Noto Sans KR', sans-serif;
      font-size: 15px;
      color: #1A1A1A;
      background: #FFFFFF;
      outline: none;
      transition: border-color 0.2s;
    }

    .task-input::placeholder {
      color: #C0C0BB;
    }

    .task-input:focus {
      border-color: #1A1A1A;
    }

    .add-btn {
      width: 50px;
      height: 50px;
      border-radius: 12px;
      border: none;
      background: #1A1A1A;
      color: #FFFFFF;
      font-size: 24px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: background 0.2s, transform 0.1s;
      line-height: 1;
    }

    .add-btn:hover {
      background: #333333;
    }

    .add-btn:active {
      transform: scale(0.95);
    }

    /* Task list */
    .task-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .task-item {
      background: #FFFFFF;
      border-radius: 14px;
      padding: 16px 16px;
      display: flex;
      align-items: center;
      gap: 14px;
      border: 1.5px solid #EEEEE9;
      animation: slideIn 0.25s ease;
      transition: opacity 0.2s;
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .task-item.done {
      opacity: 0.5;
    }

    /* Custom checkbox */
    .checkbox-wrap {
      position: relative;
      width: 22px;
      height: 22px;
      flex-shrink: 0;
      cursor: pointer;
    }

    .checkbox-wrap input[type="checkbox"] {
      position: absolute;
      opacity: 0;
      width: 0;
      height: 0;
    }

    .custom-check {
      width: 22px;
      height: 22px;
      border: 1.5px solid #CCCCCC;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s, border-color 0.2s;
      background: #FFFFFF;
    }

    .checkbox-wrap input:checked + .custom-check {
      background: #1A1A1A;
      border-color: #1A1A1A;
    }

    .check-icon {
      display: none;
      width: 11px;
      height: 8px;
    }

    .checkbox-wrap input:checked + .custom-check .check-icon {
      display: block;
    }

    /* Task text */
    .task-text {
      flex: 1;
      font-size: 15px;
      font-weight: 400;
      color: #1A1A1A;
      line-height: 1.4;
      word-break: break-all;
      transition: color 0.2s;
      text-decoration: none;
    }

    .task-item.done .task-text {
      text-decoration: line-through;
      color: #AAAAAA;
    }

    /* Delete button */
    .delete-btn {
      width: 30px;
      height: 30px;
      border: none;
      background: transparent;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      opacity: 0;
      transition: opacity 0.2s, background 0.2s;
      flex-shrink: 0;
      padding: 0;
    }

    .task-item:hover .delete-btn {
      opacity: 1;
    }

    .delete-btn:hover {
      background: #F2F2F0;
    }

    .delete-btn svg {
      width: 14px;
      height: 14px;
      stroke: #AAAAAA;
    }

    /* Empty state */
    .empty-state {
      text-align: center;
      padding: 40px 0;
      color: #C8C8C4;
      font-size: 14px;
      font-weight: 300;
      line-height: 1.8;
      display: none;
    }

    .empty-state .emoji {
      font-size: 32px;
      display: block;
      margin-bottom: 12px;
    }

    /* Mobile: always show delete */
    @media (hover: none) {
      .delete-btn { opacity: 1; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="date-label" id="date-label"></div>
      <div class="title">오늘의 할 일</div>
      <div class="progress-bar-wrap">
        <div class="progress-bar" id="progress-bar"></div>
      </div>
      <div class="progress-text" id="progress-text">아직 할 일이 없어요</div>
    </div>

    <div class="input-area">
      <input
        class="task-input"
        id="task-input"
        type="text"
        placeholder="새로운 할 일을 입력하세요..."
        maxlength="60"
        autocomplete="off"
      />
      <button class="add-btn" id="add-btn" aria-label="추가">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
          <line x1="9" y1="2" x2="9" y2="16" stroke="white" stroke-width="2" stroke-linecap="round"/>
          <line x1="2" y1="9" x2="16" y2="9" stroke="white" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </button>
    </div>

    <ul class="task-list" id="task-list"></ul>
    <div class="empty-state" id="empty-state">
      <span class="emoji">✅</span>
      아직 할 일이 없어요.<br/>위에 입력하고 + 버튼을 누르세요!
    </div>
  </div>

  <script>
    // --- State ---
    let tasks = JSON.parse(localStorage.getItem('tasks') || '[]');

    // --- Date label ---
    const dateEl = document.getElementById('date-label');
    const now = new Date();
    const days = ['일요일','월요일','화요일','수요일','목요일','금요일','토요일'];
    dateEl.textContent = `${now.getMonth()+1}월 ${now.getDate()}일 · ${days[now.getDay()]}`;

    // --- Refs ---
    const input    = document.getElementById('task-input');
    const addBtn   = document.getElementById('add-btn');
    const listEl   = document.getElementById('task-list');
    const emptyEl  = document.getElementById('empty-state');
    const barEl    = document.getElementById('progress-bar');
    const textEl   = document.getElementById('progress-text');

    // --- Render ---
    function render() {
      listEl.innerHTML = '';
      const total = tasks.length;
      const done  = tasks.filter(t => t.done).length;

      // progress
      if (total === 0) {
        barEl.style.width = '0%';
        textEl.textContent = '아직 할 일이 없어요';
        emptyEl.style.display = 'block';
      } else {
        const pct = Math.round((done / total) * 100);
        barEl.style.width = pct + '%';
        textEl.textContent = done === total
          ? `🎉 모두 완료했어요! (${total}개)`
          : `${done} / ${total} 완료`;
        emptyEl.style.display = 'none';
      }

      tasks.forEach((task, i) => {
        const li = document.createElement('li');
        li.className = 'task-item' + (task.done ? ' done' : '');

        li.innerHTML = `
          <label class="checkbox-wrap">
            <input type="checkbox" ${task.done ? 'checked' : ''} />
            <div class="custom-check">
              <svg class="check-icon" viewBox="0 0 11 8" fill="none">
                <polyline points="1,4 4,7 10,1" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </div>
          </label>
          <span class="task-text">${escapeHtml(task.text)}</span>
          <button class="delete-btn" aria-label="삭제">
            <svg viewBox="0 0 14 14" fill="none">
              <line x1="1" y1="1" x2="13" y2="13" stroke-width="2" stroke-linecap="round"/>
              <line x1="13" y1="1" x2="1" y2="13" stroke-width="2" stroke-linecap="round"/>
            </svg>
          </button>
        `;

        // Toggle done
        li.querySelector('input[type="checkbox"]').addEventListener('change', () => {
          tasks[i].done = !tasks[i].done;
          save();
          render();
        });

        // Delete with fade
        li.querySelector('.delete-btn').addEventListener('click', () => {
          li.style.transition = 'opacity 0.2s, transform 0.2s';
          li.style.opacity = '0';
          li.style.transform = 'translateX(10px)';
          setTimeout(() => {
            tasks.splice(i, 1);
            save();
            render();
          }, 200);
        });

        listEl.appendChild(li);
      });
    }

    function save() {
      localStorage.setItem('tasks', JSON.stringify(tasks));
    }

    function escapeHtml(str) {
      return str
        .replace(/&/g,'&amp;')
        .replace(/</g,'&lt;')
        .replace(/>/g,'&gt;')
        .replace(/"/g,'&quot;');
    }

    // --- Add task ---
    function addTask() {
      const text = input.value.trim();
      if (!text) return;
      tasks.push({ text, done: false });
      save();
      render();
      input.value = '';
      input.focus();
    }

    addBtn.addEventListener('click', addTask);
    input.addEventListener('keydown', e => {
      if (e.key === 'Enter') addTask();
    });

    // --- Init ---
    render();
  </script>
</body>
</html>
